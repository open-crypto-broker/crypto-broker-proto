version: '3'

vars:
  BUF_VERSION: "1.73.0"

tasks:
  ################# Development Tools ####################
  # Additional resources:
  # - https://buf.build/docs/installation
  # - https://buf.build/docs/lint/rules
  tools:
    desc: "Download tools required for development"
    deps: [install-buf]
    cmds:
      - buf --version

  install-buf:
    desc: "Download and install the buf CLI"
    preconditions:
      - sh: command -v go
        msg: "Go is required to install buf, see https://go.dev/doc/install"
    cmds:
      - go install github.com/bufbuild/buf/cmd/buf@v{{.BUF_VERSION}}

  ################# Schema Checks ####################
  lint:
    desc: "Lints the protobuf definitions against the buf STANDARD rule set"
    cmds:
      - buf lint

  format:
    desc: "Applies the canonical protobuf formatting"
    cmds:
      - buf format --write --path cryptobroker

  format-check:
    desc: "Fails if the protobuf definitions are not canonically formatted"
    cmds:
      - buf format --diff --exit-code --path cryptobroker

  breaking:
    desc: "Detects breaking schema changes against the main branch"
    cmds:
      - buf breaking --against '.git#branch=main'

  ################# Continuous Improvement Tasks ####################
  ci:
    desc: "Runs continuous integration checks on the protobuf definitions"
    cmds:
      - task: lint
      - task: format-check
      - task: breaking
