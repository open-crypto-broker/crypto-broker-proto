syntax = "proto3";

package CryptoBroker;

option go_package = "internal/protobuf";

//
// Meta-structures shared across other messages and functions
//
message Metadata {
  string id=1;
  // Attached to every response produced with a deprecated profile (see ADR 0013).
  optional DeprecationWarning deprecation=2;
  optional TraceContext traceContext=3;
}

// Self-describing record of how a stored artifact was produced (see ADR 0013).
// Persisted by the caller alongside the value so it stays verifiable and
// migratable without access to Profiles.yaml.
message CryptoDescriptor {
  string profile=1;
  // The API that produced the artifact, e.g. "HashData", "SignCertificate", "EncryptData".
  string operation=2;
  // The concrete algorithm actually used, e.g. "sha3-512", "aes-gcm".
  string algorithm=3;
}

// Deprecation signal for a profile scheduled for a rolling migration (see ADR 0013).
// replacedBy should point to an equal-or-stronger profile.
message DeprecationWarning {
  string profile=1;
  optional string replacedBy=2;
  optional string deprecatedSince=3;
  optional string removeAfter=4;
  optional string reason=5;
}

// Trace context for manual propagation
message TraceContext {
  string traceId=1;
  string spanId=2;
  string traceFlags=3;
  string traceState=4;
  string correlationId=5;
}

// Output formats
enum HashOutputFormat {
  HEX = 0;
  RAW = 1;
}

enum SignOutputFormat {
  DER = 0;
  PEM = 1;
}

// Key material source for symmetric encryption/decryption.
// Exactly one variant is set, governed by the profile:
// rawKey for caller-managed profiles (no KMS), keyId for KMS profiles where the broker
// resolves the identifier and retrieves the externally provisioned key. The broker never
// creates, imports, or deletes keys; key lifecycle is owned by the KMS/operator.
message KeySource {
  oneof source {
    string keyId  = 1;
    bytes  rawKey = 2;
  }
}

// Caller-supplied encryption parameters. The nonce is always provided by the caller;
// neither the broker nor the KMS generates it, so the caller owns nonce-uniqueness. AAD is optional.
message EncryptMetadata {
  bytes nonce=1;
  optional bytes aad=2;
}

// Metadata returned alongside the ciphertext by EncryptData. It encapsulates
// everything the caller may need besides the ciphertext itself:
//   - keyId: echoed for KMS profiles; key material is never returned.
//   - nonce/aad: echoed back; the caller supplied them and must retain them to decrypt.
//   - tag: the authentication tag the caller must retain to decrypt later.
message CipherMetadata {
  optional string keyId=1;
  bytes nonce=2;
  optional bytes aad=3;
  optional bytes tag=4;
  // Self-describing descriptor persisted alongside the ciphertext (see ADR 0013).
  CryptoDescriptor descriptor=5;
}

// Caller-supplied parameters for DecryptData. Symmetric to EncryptMetadata.
// The caller provides the nonce, AAD and tag, typically by echoing back the
// values from the CipherMetadata receipt returned by EncryptData.
message DecryptMetadata {
  bytes nonce=1;
  optional bytes aad=2;
  optional bytes tag=3;
}

//
// Application-facing crypto service definition
//
service CryptoGrpc {
  rpc HashData(HashDataRequest) returns (HashDataResponse);
  rpc SignCertificate(SignCertificateRequest) returns (SignCertificateResponse);
  rpc EncryptData(EncryptDataRequest) returns (EncryptDataResponse);
  rpc DecryptData(DecryptDataRequest) returns (DecryptDataResponse);
}

// HashData request and response messages
message HashDataRequest {
  string profile=1;
  bytes input=2;
  Metadata metadata=3;
  HashOutputFormat outputFormat=4;
}

message HashDataResponse {
  // Redundant with descriptor.algorithm; retained for backward compatibility.
  string hashAlgorithm=2;
  Metadata metadata=3;
  oneof hashValue {
    string hashValueHex = 4;
    bytes hashValueRaw  = 5;
  }
  CryptoDescriptor descriptor=6;
}

// SignCertificate response and request messages
message SignCertificateRequest {
  string profile=1;
  string csr=2;
  string caPrivateKey=3;
  string caCert=4;
  Metadata metadata=5;
  optional uint64 validNotBefore=6;
  optional uint64 validNotAfter=7;
  optional string subject=8;
  repeated string crlDistributionPoints=9;
  SignOutputFormat outputFormat=10;
}

// Response to a SignCertificate Request
message SignCertificateResponse {
  Metadata metadata=2;
  oneof signedCertificate {
    string pem = 3;
    bytes der  = 4;
  }
  CryptoDescriptor descriptor=5;
}

// EncryptData request and response messages
message EncryptDataRequest {
  string profile=1;
  KeySource keySource=2;
  bytes plaintext=3;
  optional EncryptMetadata encryptMetadata=4;
  Metadata metadata=5;
}

message EncryptDataResponse {
  bytes ciphertext=1;
  CipherMetadata cipherMetadata=2;
  Metadata metadata=3;
}

// DecryptData request and response messages
message DecryptDataRequest {
  string profile=1;
  KeySource keySource=2;
  bytes ciphertext=3;
  optional DecryptMetadata decryptMetadata=4;
  Metadata metadata=5;
}

message DecryptDataResponse {
  bytes plaintext=1;
  Metadata metadata=2;
}

//
// Internal development service definition
//
service CryptoGrpcDev {
  rpc Benchmark(BenchmarkRequest) returns (BenchmarkResponse);
  rpc FakeEndpoint(FakeEndpointRequest) returns (FakeEndpointResponse);
}

// Benchmark request and response messages
message BenchmarkRequest {
  Metadata metadata=1;
}

message BenchmarkResponse {
  string benchmarkResults=1;
  Metadata metadata=2;
}

// FakeEndpoint request and response messages
message FakeEndpointRequest {
  Metadata metadata=1;
}

message FakeEndpointResponse {
  string message=1;
  Metadata metadata=2;
}
